{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/register.css' %}">

<div class="register-container">
    <div class="register-box">

        <h1>Create Account</h1>
        <p class="subtitle">Join JobConnect and find your dream job</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="profilepic">Profile Picture</label>
            <input type="file" name="profilepic"><br>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" ><br>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" ><br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" ><br>


            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   placeholder="Confirm your password" ><br>
            
            <label for="">Phone Number</label>
            <input type="number" name="number"><br>

            <label for="">Upload Resume</label>
            <input type="file" placeholder="upload your reume"  name="cv"><br>
        

            <button type="submit">Register</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>
</div>

{% endblock %}
